# Grafana minimal config — 未列出的选项全部使用内置默认值。
# 完整参考: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/

[security]
# 允许仪表盘被嵌入 iframe
allow_embedding = true

[auth.anonymous]
# 匿名访问关闭：所有用户必须登录。管理员口令由 profile 的 GRAFANA_ADMIN_PASSWORD 注入
# （GF_SECURITY_ADMIN_PASSWORD，仅首次初始化生效；存量实例用 grafana cli admin reset-admin-password）。
enabled = false
