apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: false
    # Dashboard JSON files in grafana/conf/dashboards/ are auto-provisioned.
    # glseven-targets.json is the built-in Targets dashboard; add more exports here.
    options:
      path: /var/lib/grafana/dashboards
