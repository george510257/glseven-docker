name: apps

networks:
  glseven:
    external: true

# 本域服务不发布宿主端口；宿主访问统一经 portal（nginx）代理，见 portal/conf/。
# 新增或改名服务需同步 5 处，见 common/check-consistency.sh 与 README。

x-healthy: &healthy
  file: ../common/base-service.yml
  service: service-healthy

services:

# Apps 172.18.5.x ==================================================================================

  ollama:
    extends: *healthy
    image: ollama/ollama:0.33.3
    container_name: ollama
    hostname: ollama
    tty: true
    env_file:
      - env/ollama.env
    volumes:
      - ${DOCKER_VOLUME:?DOCKER_VOLUME is required (set it in the active profile)}/ollama:/root/.ollama
    networks:
      glseven:
        ipv4_address: 172.18.5.1
    healthcheck:
      test: ["CMD-SHELL", "ollama ls"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        # GPU 硬请求已移除：nvidia device 驱动在 macOS(Docker Desktop) 上不存在，
        # 会导致 compose up 失败（could not select device driver "nvidia"）；
        # ollama 无 GPU 时自动回退 CPU 运行。Linux 宿主如需 GPU 加速，按需追加：
        #   reservations:
        #     devices:
        #       - driver: nvidia
        #         capabilities: [ gpu ]
        #         count: all

  open-webui:
    extends: *healthy
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: open-webui
    hostname: open-webui
    env_file:
      - env/open-webui.env
    volumes:
      - ${DOCKER_VOLUME:?DOCKER_VOLUME is required (set it in the active profile)}/open-webui/data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      glseven:
        ipv4_address: 172.18.5.2
    healthcheck:
      # /health 为 open-webui 自带端点；探针工具按 Task 1 验证结果。
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://localhost:8080/health || exit 1"]

  moontv:
    extends: *healthy
    image: ghcr.io/moontechlab/lunatv:v100.1.3
    container_name: moontv
    hostname: moontv
    env_file:
      - env/moontv.env
    # redis 在 infra 域：跨 compose project 不写 depends_on，由 BASE 先于 DEFERRED 启动时序 + restart: always 兜底。
    environment:
      # Overrides REDIS_URL from moontv.env; password sourced from .env (REDIS_PASSWORD).
      REDIS_URL: "redis://:${REDIS_PASSWORD:-glseven_redis_2024}@redis:6379"
    networks:
      glseven:
        ipv4_address: 172.18.5.3
    healthcheck:
      # 探针工具按 Task 1 验证结果（默认 wget；仅 curl 可用则等价替换）。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]

  iptv:
    extends: *healthy
    image: akiralereal/iptv:4.15.0
    container_name: iptv
    hostname: iptv
    init: true                    # 回收 Chromium 僵尸进程
    env_file:
      - env/iptv.env
    volumes:
      # /migu/data 是镜像内置 VOLUME；不显式覆盖时每次重建容器都会生成匿名 hash 卷。
      - ${DOCKER_VOLUME:?DOCKER_VOLUME is required (set it in the active profile)}/iptv/data:/iptv/data
      - ${DOCKER_VOLUME:?DOCKER_VOLUME is required (set it in the active profile)}/iptv/migu:/migu/data
    networks:
      glseven:
        ipv4_address: 172.18.5.4
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1905/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
