networks:
  glseven:
    external: true

services:

  # TV 172.18.8.x ======================================================================================================

  moontv:
    image: ghcr.io/moontechlab/lunatv:v100.1.1
    container_name: moontv
    hostname: moontv
    restart: always
    env_file:
      - common/env/common.env
      - common/env/moontv.env
    networks:
      glseven:
        ipv4_address: 172.18.8.1
    ports:
      - "3001:3000"

  libretv:
    image: bestzwei/libretv:202508060117
    container_name: libretv
    hostname: libretv
    restart: always
    env_file:
      - common/env/common.env
      - common/env/libretv.env
    networks:
      glseven:
        ipv4_address: 172.18.8.2
    ports:
      - "8899:8080"
