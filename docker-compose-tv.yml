networks:
  glseven:
    external: true

services:
  moontv:
    image: ghcr.io/moontechlab/lunatv
    container_name: moontv
    hostname: moontv
    restart: always
    env_file:
      - common/env/common.env
      - common/env/moontv.env
    networks:
      glseven:
        ipv4_address: 172.18.5.1
    ports:
      - "3001:3000"

  libretv:
    image: bestzwei/libretv
    container_name: libretv
    hostname: libretv
    restart: always
    env_file:
      - common/env/common.env
      - common/env/libretv.env
    networks:
      glseven:
        ipv4_address: 172.18.5.2
    ports:
      - "8899:8080"
