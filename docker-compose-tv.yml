name: tv

networks:
  glseven:
    external: true

services:

  # TV 172.18.8.x ======================================================================================================

  moontv:
    image: ghcr.io/moontechlab/lunatv:v100.1.1
    container_name: moontv
    hostname: moontv
    restart: always
    env_file:
      - common/env/common.env
      - common/env/moontv.env
    environment:
      # Overrides REDIS_URL from moontv.env; password sourced from .env (REDIS_PASSWORD).
      REDIS_URL: "redis://:${REDIS_PASSWORD:-glseven_redis_2024}@redis:6379"
    networks:
      glseven:
        ipv4_address: 172.18.8.1
    ports:
      - "3001:3000"

  libretv:
    image: bestzwei/libretv:202508060117
    container_name: libretv
    hostname: libretv
    restart: always
    env_file:
      - common/env/common.env
      - common/env/libretv.env
    networks:
      glseven:
        ipv4_address: 172.18.8.2
    ports:
      - "8899:8080"
