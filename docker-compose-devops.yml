version: "3.6"

networks:
  glseven:
    external: true

services:

  # DevOps环境 172.18.2网段 8000端口段 ==================================================================================
  nexus3:
    image: sonatype/nexus3:3.63.0
    container_name: nexus3
    hostname: nexus3
    restart: always
    privileged: true
    env_file:
      - common/env/common.env
    volumes:
      - ${DOCKER_VOLUME}/nexus3/data:/nexus-data
    networks:
      glseven:
        ipv4_address: 172.18.2.1
    ports:
      - "5000:5000"
      - "8081:8081"

  pandora-next:
    image: pengzhile/pandora-next:0.6.1
    container_name: pandora-next
    hostname: pandora-next
    restart: always
    env_file:
      - common/env/common.env
    volumes:
      - ${DOCKER_VOLUME}/pandora/data:/data
      - ${DOCKER_VOLUME}/pandora/sessions:/root/.cache/PandoraNext
    networks:
      glseven:
        ipv4_address: 172.18.2.2
    ports:
      - "8181:8181"

  alist:
    image: xhofe/alist:v3.30.0
    container_name: alist
    hostname: alist
    restart: always
    env_file:
      - common/env/common.env
      - common/env/alist.env
    volumes:
      - ${DOCKER_VOLUME}/alist/data:/opt/alist/data
    networks:
      glseven:
        ipv4_address: 172.18.2.3
    ports:
      - "5244:5244"