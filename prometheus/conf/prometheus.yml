global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: "rabbitmq"
    static_configs:
      - targets: [ "rabbitmq:15692" ]

  - job_name: "nacos"
    # Nacos v3 Actuator endpoints are served on port 8080 (console port),
    # not port 8848 (API/config port).
    metrics_path: "/nacos/actuator/prometheus"
    static_configs:
      - targets: [ "nacos:8080" ]
