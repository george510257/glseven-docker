global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: "rabbitmq"
    static_configs:
      - targets: [ "rabbitmq:15692" ]

  - job_name: "nacos"
    # Nacos v3 Actuator endpoints are served on port 8080 (console port),
    # not port 8848 (API/config port).
    metrics_path: "/nacos/actuator/prometheus"
    static_configs:
      - targets: [ "nacos:8080" ]

  - job_name: "apisix"
    # prometheus 插件导出地址（apisix/conf/config.yaml 中 export_addr 0.0.0.0:9091）。
    metrics_path: "/apisix/prometheus/metrics"
    static_configs:
      - targets: [ "apisix:9091" ]

  - job_name: "etcd"
    static_configs:
      - targets: [ "etcd:2379" ]

  - job_name: "keycloak"
    # KC_HEALTH_ENABLED/KC_METRICS_ENABLED=true 开启的 9000 管理端口（未对宿主机映射）。
    metrics_path: "/metrics"
    static_configs:
      - targets: [ "keycloak:9000" ]

  - job_name: "grafana"
    metrics_path: "/metrics"
    static_configs:
      - targets: [ "grafana:3000" ]

  # kafka（需 jmx exporter）、elk ES（需插件）、moontv（无原生端点）不接入，避免引入额外组件。
