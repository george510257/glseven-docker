# ELK：Kibana UI（5601）与 ES API（9200）同域名不同端口
server {
    listen 5601;
    server_name elk.glseven.local;
    # ELK 在 Apple Silicon 上会被 startup.sh 跳过；运行时解析避免 nginx 启动失败。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $elk_kibana "elk:5601";
    location / {
        proxy_pass http://$elk_kibana;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 9200;
    server_name elk.glseven.local;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $elk_api "elk:9200";
    location / {
        proxy_pass http://$elk_api;
        include /etc/nginx/snippets/proxy.conf;
    }
}
