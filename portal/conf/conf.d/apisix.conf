# APISIX：数据面（9080）与 Admin API（9180，X-API-KEY 鉴权）同域名不同端口
server {
    listen 9080;
    server_name apisix.glseven.local;
    location / {
        proxy_pass http://apisix:9080;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 9180;
    server_name apisix.glseven.local;
    location / {
        proxy_pass http://apisix:9180;
        include /etc/nginx/snippets/proxy.conf;
    }
}
