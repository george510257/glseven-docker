# 静态门户（nginx 自身）：全栈唯一非原生端口约定（宿主 8000，见 compose ports 注释）。
# portal.glseven.local 是正式入口；根域保留为存量书签的兼容跳转。
server {
    listen 8000 default_server;
    server_name glseven.local;
    return 301 http://portal.glseven.local:8000$request_uri;
}

server {
    listen 8000;
    server_name portal.glseven.local;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
