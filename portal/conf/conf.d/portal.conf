# 静态门户（nginx 自身）：经 8080 共享入口，按 server_name 分流。
# portal.glseven.local 是正式入口；根域保留为存量书签的兼容跳转。
server {
    listen 8080;
    server_name glseven.local;
    return 301 http://portal.glseven.local:8080$request_uri;
}

server {
    listen 8080;
    server_name portal.glseven.local;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
