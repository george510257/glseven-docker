# stream：Kafka 双 listener 透传——9092 为存量兼容透传（宿主旧 hosts 接入路径，PLAINTEXT
# advertised 裸名 kafka 靠 hosts 解析闭环；容器网络内客户端直连 kafka:9092 不经 nginx），
# 29092 供宿主/局域网（EXTERNAL，advertised 地址由 infra/docker-compose.yml 从当前档案的 KAFKA_EXTERNAL_HOST 渲染）
server { listen 9092;  proxy_pass kafka:9092; }
server { listen 29092; proxy_pass kafka:29092; }
