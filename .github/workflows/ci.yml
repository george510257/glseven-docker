name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z '*.sh')

      - name: Prepare Compose environment
        run: cp .env.local.example .env.local

      - name: Run script tests
        shell: bash
        run: |
          set -euo pipefail
          for test_script in ci/scripts/test-*.sh; do
            echo "Running $test_script"
            bash "$test_script"
          done

      - name: Assert profiles are ignored
        shell: bash
        run: |
          set -euo pipefail
          for path in .env.local .env.sit .glseven-profile; do
            git check-ignore -q "$path"
          done
          if git check-ignore -q .env.local.example; then
            echo "::error::.env.local.example must not be ignored"
            exit 1
          fi

      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docker-compose-*.yml)
          [[ ${#files[@]} -gt 0 ]]
          for file in "${files[@]}"; do
            echo "Validating $file"
            docker compose --env-file .env.local -f "$file" config -q
          done

      - name: Check portal consistency
        run: bash common/check-consistency.sh --strict

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          case "$EVENT_NAME" in
            pull_request)
              git fetch --no-tags origin \
                "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
              merge_base="$(git merge-base "origin/$BASE_REF" HEAD)"
              git diff --check "$merge_base" HEAD
              ;;
            push)
              if [[ "$EVENT_BEFORE" =~ ^0+$ ]] ||
                ! git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
                git diff --check "$empty_tree" HEAD
              else
                git diff --check "$EVENT_BEFORE" HEAD
              fi
              ;;
            *)
              git diff --check "$empty_tree" HEAD
              ;;
          esac
