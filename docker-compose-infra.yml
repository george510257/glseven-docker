name: infra

networks:
  glseven:
    external: true

services:

  # Infra 172.18.1.x ===================================================================================================

  mysql:
    image: mysql:9.7.2
    container_name: mysql
    hostname: mysql
    restart: always
    env_file:
      - common/env/common.env
      - common/env/mysql.env
    volumes:
      - ${DOCKER_VOLUME:-/docker/glseven}/mysql/data:/var/lib/mysql
      - ${DOCKER_VOLUME:-/docker/glseven}/mysql/conf.d:/etc/mysql/conf.d
      - ./mysql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      glseven:
        ipv4_address: 172.18.1.1
    ports:
      - "3306:3306"
      # Port 33060 (MySQL X Protocol) is not used by any service; removed to reduce attack surface.
    healthcheck:
      # $$ 让容器内 shell 展开 env_file 注入的 MYSQL_ROOT_PASSWORD，不依赖 compose 插值。
      test: [ "CMD-SHELL", "mysqladmin ping -h127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.10.1
    container_name: redis
    hostname: redis
    restart: always
    # --requirepass enables password authentication.
    # REDIS_PASSWORD comes from .env (see .env.example); the fallback keeps no-.env usage working.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-glseven_redis_2024}
    env_file:
      - common/env/common.env
    volumes:
      - ${DOCKER_VOLUME:-/docker/glseven}/redis/data:/data
    networks:
      glseven:
        ipv4_address: 172.18.1.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-glseven_redis_2024}' ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:8.0.29
    container_name: mongo
    hostname: mongo
    restart: always
    env_file:
      - common/env/common.env
      - common/env/mongo.env
    volumes:
      - ${DOCKER_VOLUME:-/docker/glseven}/mongo/data/db:/data/db
      - ${DOCKER_VOLUME:-/docker/glseven}/mongo/data/configdb:/data/configdb
    networks:
      glseven:
        ipv4_address: 172.18.1.3
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo-express:
    # mongo-express 已是最新稳定版（1.1.0 仍为 RC）；官方镜像已标注 DEPRECATED，维持不动。
    image: mongo-express:1.0.2
    container_name: mongo-express
    hostname: mongo-express
    restart: always
    env_file:
      - common/env/common.env
      - common/env/mongo-express.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      glseven:
        ipv4_address: 172.18.1.4
    ports:
      - "18081:8081"
    healthcheck:
      # 镜像内仅 wget 可用（Task 1 实测，无 curl）。
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer:6.0.1
    container_name: adminer
    hostname: adminer
    restart: always
    env_file:
      - common/env/common.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      glseven:
        ipv4_address: 172.18.1.5
    ports:
      - "18080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:8080/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: always
    env_file:
      - common/env/common.env
      - common/env/rabbitmq.env
    volumes:
      - ${DOCKER_VOLUME:-/docker/glseven}/rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    networks:
      glseven:
        ipv4_address: 172.18.1.6
    ports:
      - "35672:5672"   # AMQP
      - "15672:15672"  # Management UI
      - "1883:1883"    # MQTT
      - "15675:15675"  # MQTT over WebSocket
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    restart: always
    env_file:
      - common/env/common.env
      - common/env/kafka.env
    volumes:
      - ${DOCKER_VOLUME:-/docker/glseven}/kafka/config:/mnt/shared/config
      - ${DOCKER_VOLUME:-/docker/glseven}/kafka/data:/var/lib/kafka/data
      - ${DOCKER_VOLUME:-/docker/glseven}/kafka/secrets:/etc/kafka/secrets
    networks:
      glseven:
        ipv4_address: 172.18.1.7
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  etcd:
    # v3.7.1 已发布（2026-07）但仅 2 个月，选 3.6 成熟维护线保障 APISIX 互操作（沿 nginx stable 先例）。
    # 供 APISIX（platform 域）与 Prometheus 使用：跨 compose project 不写 depends_on，
    # 由 BASE 批次先于 DEFERRED 启动时序 + APISIX 启动重试 + restart: always 兜底。
    # 纯容器网络内部使用，不对宿主机映射端口。
    image: quay.io/coreos/etcd:v3.6.14
    container_name: etcd
    hostname: etcd
    restart: always
    env_file:
      - common/env/common.env
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    volumes:
      - ${DOCKER_VOLUME:-/docker/glseven}/etcd/data:/etcd-data
    networks:
      glseven:
        ipv4_address: 172.18.1.8
    healthcheck:
      # 镜像内无 shell（Task 1 实测），必须用 exec 形式而非 CMD-SHELL。
      test: [ "CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
