version: "3.6"

networks:
  glseven:
    external: true

services:
  mysql:
    image: mysql
    container_name: mysql
    hostname: mysql
    restart: always
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci'] 
    env_file:
      - common/env/common.env
      - common/env/mysql.env
    volumes:
      - ${DOCKER_VOLUME}/mysql/data:/var/lib/mysql
      - ${DOCKER_VOLUME}/mysql/conf.d:/etc/mysql/conf.d
      - ./mysql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      glseven:
        ipv4_address: 172.18.1.1
    ports:
      - "3306:3306"
      - "33060:33060"

  redis:
    image: redis
    container_name: redis
    hostname: redis
    restart: always
    command: redis-server --appendonly yes
    env_file:
      - common/env/common.env
    volumes:
      - ${DOCKER_VOLUME}/redis/data:/data
    networks:
      glseven:
        ipv4_address: 172.18.1.2
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    restart: always
    env_file:
      - common/env/common.env
    volumes:
      - ${DOCKER_VOLUME}/rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    networks:
      glseven:
        ipv4_address: 172.18.1.3
    ports:
      - "4369:4369"
      - "5671:5671"
      - "5672:5672"
      - "15671:15671"
      - "15672:15672"
      - "25672:25672"

  mongo:
    image: mongo:7.0.7
    container_name: mongo
    hostname: mongo
    restart: always
    env_file:
      - common/env/common.env
      - common/env/mongo.env
    volumes:
      - ${DOCKER_VOLUME}/mongo/data/db:/data/db
      - ${DOCKER_VOLUME}/mongo/data/configdb:/data/configdb
    networks:
      glseven:
        ipv4_address: 172.18.1.4
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    hostname: mongo-express
    restart: always
    env_file:
      - common/env/common.env
      - common/env/mongo-express.env
    depends_on:
      - mongo
    networks:
      glseven:
        ipv4_address: 172.18.1.5
    ports:
      - "18081:8081"

  adminer:
    image: adminer
    container_name: adminer
    hostname: adminer
    restart: always
    networks:
      glseven:
        ipv4_address: 172.18.1.6
    ports:
      - "18080:8080"

  openldap:
    image: osixia/openldap
    container_name: openldap
    hostname: openldap
    restart: always
    env_file:
      - common/env/common.env
      - common/env/openldap.env
    volumes:
      - ${DOCKER_VOLUME}/openldap/data:/var/lib/ldap
      - ${DOCKER_VOLUME}/openldap/config:/etc/ldap/slapd.d
    networks:
      glseven:
        ipv4_address: 172.18.1.7
    ports:
      - "389:389"
      - "636:636"

  php-ldap-admin:
    image: osixia/phpldapadmin
    container_name: php-ldap-admin
    hostname: php-ldap-admin
    restart: always
    env_file:
      - common/env/common.env
      - common/env/phpldapadmin.env
    volumes:
      - ${DOCKER_VOLUME}/phpldapadmin/data:/var/www/phpldapadmin
    links:
      - openldap
    networks:
      glseven:
        ipv4_address: 172.18.1.8
    ports:
      - "6080:80"
      - "6443:443"

  etcd:
    image: bitnami/etcd
    container_name: etcd
    hostname: etcd
    restart: always
    env_file:
      - common/env/common.env
      - common/env/etcd.env
    volumes:
      - ${DOCKER_VOLUME}/etcd/data:/bitnami/etcd
    networks:
      glseven:
        ipv4_address: 172.18.1.9
    ports:
      - "2379:2379"

  elk:
    image: sebp/elk
    container_name: elk
    hostname: elk
    restart: always
    env_file:
      - common/env/common.env
    volumes:
      - ./elk/kibana/config/kibana.yml:/opt/kibana/config/kibana.yml
      - ${DOCKER_VOLUME}/elk/data:/var/lib/elasticsearch
    networks:
      glseven:
        ipv4_address: 172.18.1.10
    ports:
      - "5601:5601"
      - "9200:9200"
      - "5044:5044"

  kafka:
    image: bitnami/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    restart: always
    env_file:
      - common/env/common.env
      - common/env/kafka.env
    volumes:
      - ${DOCKER_VOLUME}/kafka/data:/bitnami
    networks:
      glseven:
        ipv4_address: 172.18.1.12
    ports:
      - "19092:9092"