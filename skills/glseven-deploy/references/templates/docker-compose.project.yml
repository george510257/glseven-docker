# 服务名/容器名统一为 <project>-<service>；镜像名为 docker-hosted/<project>-<service>:<tag>。
name: <project>

networks:
  glseven:
    external: true

services:
  <project>-auth:
    image: 192.168.31.100:5000/docker-hosted/<project>-auth:<tag>
    container_name: <project>-auth
    hostname: <project>-auth
    restart: always
    env_file:
      - .env
    environment:
      # 每个服务按自己的库名设置；容器内 host 用服务名 mysql。
      DB_URL: "jdbc:mysql://mysql:3306/<db-name>?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true"
    extra_hosts:
      # AUTH_ISSUER 用对外域名时，容器需要把域名解析到 portal；gateway 同样需要。
      - "<project>.glseven.local:172.18.6.1"
    networks:
      - glseven
    # 不发布宿主端口：统一由 portal 代理。
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  <project>-web:
    image: 192.168.31.100:5000/docker-hosted/<project>-web:<tag>
    container_name: <project>-web
    hostname: <project>-web
    restart: always
    networks:
      - glseven
    # nginx:alpine 没有 bash；用 busybox wget 探针。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  # 其余服务按同样结构复制：<project>-system（8083）/ <project>-codegen（8082）/ <project>-gateway（8000/8001）
  # Java 服务的 healthcheck 端口要改成各自端口；gateway 需要 extra_hosts 与 NACOS_SERVER_ADDR。
