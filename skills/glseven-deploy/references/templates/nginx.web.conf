server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # qiankun HTML 入口：主应用按 /micro/sub-*/ 加载子应用。
    location /micro/sub-auth/ { try_files $uri $uri/ /sub-auth/index.html; }
    location /micro/sub-codegen/ { try_files $uri $uri/ /sub-codegen/index.html; }
    location /micro/sub-system/ { try_files $uri $uri/ /sub-system/index.html; }

    # 子应用静态资源与业务路由（base /sub-*/）。
    location /sub-auth/ { try_files $uri $uri/ /sub-auth/index.html; }
    location /sub-codegen/ { try_files $uri $uri/ /sub-codegen/index.html; }
    location /sub-system/ { try_files $uri $uri/ /sub-system/index.html; }

    # API 与 OAuth2 反代到网关；头直接内联，避免依赖外部 snippet。
    location /api/ {
        proxy_pass http://<project>-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /oauth2/ {
        proxy_pass http://<project>-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
