# 公共服务模板：各域 compose 通过 extends 引用；本文件不是启动单元，
# 不参与 common/compose-list.sh 的批次。修改后请跑 ci/scripts/test-compose-style.sh。
services:
  service-base:
    restart: always

  service-common:
    extends: service-base
    env_file:
      - env/common.env

  service-healthy:
    extends: service-common
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
