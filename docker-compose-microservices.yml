version: "3.6"

networks:
  glseven:
    external: true

services:
  nacos:
    image: nacos/nacos-server
    container_name: nacos
    hostname: nacos
    restart: always
    env_file:
      - common/env/common.env
      - common/env/nacos.env
    volumes:
      - ${DOCKER_VOLUME}/nacos/logs:/home/nacos/logs
      - ./nacos/config/custom.properties:/home/nacos/init.d/custom.properties
    networks:
      glseven:
        ipv4_address: 172.18.4.1
    external_links:
      - mysql
    ports:
      - "8848:8848"
      - "9555:9555"
      - "9848:9848"
      - "9849:9849"

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.1.1
    container_name: xxl-job-admin
    hostname: xxl-job-admin
    restart: always
    env_file:
      - common/env/common.env
    volumes:
      - ${DOCKER_VOLUME}/xxl-job-admin/logs:/data/applogs
      - ./xxl-job-admin/application.properties:/application.properties
    networks:
      glseven:
        ipv4_address: 172.18.4.2
    external_links:
      - mysql
    ports:
      - "48080:8080"

  keycloak:
    image: keycloak/keycloak
    container_name: keycloak
    hostname: keycloak
    restart: always
    command: start --optimized --hostname-port=48443
    env_file:
      - common/env/common.env
      - common/env/keycloak.env
    networks:
      glseven:
        ipv4_address: 172.18.4.3
    ports:
      - "48443:8443"

  apisix-dashboard:
    image: apache/apisix-dashboard
    container_name: apisix-dashboard
    hostname: apisix-dashboard
    restart: always
    env_file:
      - common/env/common.env
    volumes:
      - ./apisix-dashboard/conf/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml
    networks:
      glseven:
        ipv4_address: 172.18.4.4
    ports:
      - "49000:9000"

  apisix:
    image: apache/apisix
    container_name: apisix
    hostname: apisix
    restart: always
    env_file:
      - common/env/common.env
    volumes:
      - ${DOCKER_VOLUME}/apisix/log:/usr/local/apisix/logs
      - ./apisix/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    networks:
      glseven:
        ipv4_address: 172.18.4.5
    external_links:
      - etcd
    ports:
      - "9180:9180"
      - "9080:9080"
      - "9091:9091"
      - "9443:9443"
      - "9092:9092"

  ollama:
    image: ollama/ollama
    container_name: ollama
    hostname: ollama
    restart: always
    env_file:
      - common/env/common.env
    volumes:
      - ${DOCKER_VOLUME}/ollama/data:/root/.ollama
    networks:
      glseven:
        ipv4_address: 172.18.4.6
    ports:
      - "11434:11434"