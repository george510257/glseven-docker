# 覆盖 sebp/elk 镜像内置的 /etc/logstash/conf.d/02-beats-input.conf。
# 内置版本要求 TLS（ssl => true + 镜像自带自签证书 logstash-beats.crt），
# filebeat 不配 certificate_authorities 则握手失败、日志进不来。
# 本编排取值：明文 beats 输入——glseven 网络为隔离的开发环境网络，
# 全栈（DB/LDAP/Kafka/APISIX）本就明文，此处保持一致，避免搬运镜像内自签证书。
# 如需恢复 TLS：删掉本文件的挂载，并在 filebeat.yml 的 output.logstash 下补
#   ssl.certificate_authorities: ["/path/to/logstash-beats.crt"]
input {
  beats {
    port => 5044
  }
}
