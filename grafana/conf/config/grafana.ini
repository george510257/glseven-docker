# Grafana minimal config — 未列出的选项全部使用内置默认值。
# 完整参考: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/

[security]
# 允许仪表盘被嵌入 iframe
allow_embedding = true

[auth.anonymous]
# 匿名访问关闭：所有用户必须登录。默认管理员凭据 admin/admin，首次登录后请修改，
# 或通过 GF_SECURITY_ADMIN_PASSWORD 环境变量设置。
enabled = false
